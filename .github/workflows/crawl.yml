name: 기간제교사 채용공고 크롤링

on:
  schedule:
    - cron: '0 */2 * * *'   # 채용공고: 2시간마다
    - cron: '0 16 * * *'    # 학교데이터 전체갱신: 매일 새벽 1시 (KST=UTC+9)
  workflow_dispatch:
    inputs:
      refresh_schools:
        description: '학교 데이터 전체 재수집 (평소엔 체크 불필요)'
        type: boolean
        default: false

concurrency:
  group: crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 패키지 설치
        run: npm install

      # Puppeteer Chrome 캐싱 (매번 300MB 다운로드 방지)
      - name: Puppeteer Chrome 캐시 복원
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-v1

      - name: Puppeteer Chrome 설치
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome

      - name: 크롤링 실행
        run: npm run crawl

      - name: 학교알리미 UUID 수집
        run: npm run get-uuids

      - name: 학교 데이터 수집
        run: npm run schools
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          # 전체갱신 조건: 새벽 1시 자동실행 OR 수동으로 체크박스 선택
          FORCE_REFRESH: ${{ (github.event.schedule == '0 16 * * *' || inputs.refresh_schools == 'true') && '1' || '0' }}

      - name: 결과 저장 (자동 커밋)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "자동 업데이트: 채용공고 + 학교 데이터"
          file_pattern: data/jobs.json data/schools.json data/school-uuids.json
          push_options: '--force-with-lease'
